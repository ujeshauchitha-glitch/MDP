<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
    <style>
      .box{fill:#f6f8fa;stroke:#444;stroke-width:1.3}
      .slow{fill:#e8f1fb;stroke:#2f6fb5;stroke-width:1.3}
      .wide{fill:#fdf0e3;stroke:#c1701c;stroke-width:1.3}
      .dig{fill:#eaf6ea;stroke:#3b8a3b;stroke-width:1.3}
      .ln{stroke:#333;stroke-width:1.4;fill:none}
      .t{fill:#111}.s{fill:#555;font-size:11px}.h{font-weight:600;font-size:13px}
    </style>
  </defs>
  <rect width="980" height="640" fill="#fff"/>
  <text x="20" y="26" class="h t" font-size="16">TrustSense Layer 1 AFE: final simulated architecture (sky130, VDD 3.3 V, VCM 1.4 V)</text>
  <text x="20" y="44" class="s">All values from ngspice 47 (tt/27 °C unless noted); nothing fabricated or measured. See docs/STATUS.md and afe-architecture.md §15-§25.</text>

  <!-- photodiode -->
  <rect class="box" x="20" y="250" width="150" height="110" rx="6"/>
  <text x="95" y="272" text-anchor="middle" class="h t">Photodiode</text>
  <text x="95" y="292" text-anchor="middle" class="s">Iph = I_DC + m·I_DC·chips</text>
  <text x="95" y="308" text-anchor="middle" class="s">+ PPG, + ambient</text>
  <text x="95" y="328" text-anchor="middle" class="s">Cj 10 pF, Rs 100 Ω (assumed)</text>
  <circle cx="215" cy="305" r="5" fill="#333"/>
  <text x="215" y="333" text-anchor="middle" class="t">node x</text>
  <text x="215" y="347" text-anchor="middle" class="s">held at VCM by</text>
  <text x="215" y="360" text-anchor="middle" class="s">slow TIA</text>
  <path class="ln" d="M170 305H210" marker-end="url(#a)"/>

  <!-- slow path -->
  <rect class="slow" x="260" y="70" width="400" height="170" rx="8"/>
  <text x="460" y="92" text-anchor="middle" class="h t">SLOW PATH (PPG)  — direct off the photodiode</text>
  <rect class="box" x="275" y="106" width="150" height="62" rx="5"/>
  <text x="350" y="124" text-anchor="middle" class="h t">T-network feedback</text>
  <text x="350" y="140" text-anchor="middle" class="s">R1=R2=10M, R3=102k→VCM</text>
  <text x="350" y="155" text-anchor="middle" class="s">+ switched range R ∥</text>
  <rect class="box" x="445" y="106" width="200" height="62" rx="5"/>
  <text x="545" y="124" text-anchor="middle" class="h t">2-stage TIA op-amp</text>
  <text x="545" y="140" text-anchor="middle" class="s">PMOS pair, Miller Cc 4.2 pF</text>
  <text x="545" y="155" text-anchor="middle" class="s">source-follower out → s_out</text>
  <rect class="box" x="275" y="180" width="370" height="48" rx="5"/>
  <text x="460" y="199" text-anchor="middle" class="s" style="font-size:10.5px">1 GΩ 50 fF 2.8 kHz | 100 MΩ 100 fF 9.5 kHz | 10 MΩ 500 fF 25 kHz</text>
  <text x="460" y="216" text-anchor="middle" class="s" style="font-size:10.5px">Z within 1.5 % over PVT/supply; PPG headroom ±0.3 / ±3 / ±30 nA</text>
  <path class="ln" d="M215 300 C 238 300 250 120 275 120" marker-end="url(#a)"/>

  <!-- wide path -->
  <rect class="wide" x="260" y="380" width="400" height="215" rx="8"/>
  <text x="460" y="402" text-anchor="middle" class="h t">WIDEBAND PATH (anti-spoof verifier)</text>
  <rect class="box" x="275" y="416" width="70" height="40" rx="5"/>
  <text x="310" y="434" text-anchor="middle" class="h t">Cc</text>
  <text x="310" y="448" text-anchor="middle" class="s">50 pF</text>
  <rect class="box" x="360" y="416" width="115" height="40" rx="5"/>
  <text x="417" y="434" text-anchor="middle" class="h t">Mc  (PMOS CG)</text>
  <text x="417" y="448" text-anchor="middle" class="s">W=80, well on VCM</text>
  <rect class="box" x="490" y="416" width="155" height="40" rx="5"/>
  <text x="567" y="434" text-anchor="middle" class="h t">NMOS mirror ×4</text>
  <text x="567" y="448" text-anchor="middle" class="s">200 kΩ source degeneration</text>
  <rect class="box" x="275" y="470" width="370" height="48" rx="5"/>
  <text x="460" y="489" text-anchor="middle" class="h t">Wideband TIA   Rf 314 kΩ, Cf 1.4 pF</text>
  <text x="460" y="506" text-anchor="middle" class="s">≈ 280 kHz, 0.6 pA/√Hz at 100 kHz, ~85 µW</text>
  <rect class="box" x="275" y="530" width="370" height="50" rx="5"/>
  <text x="460" y="548" text-anchor="middle" class="h t">Bias: degenerated PMOS mirror</text>
  <text x="460" y="564" text-anchor="middle" class="s">IBX 300 nA (ref. from const. Iref) → xc; cancel into TIA</text>
  <path class="ln" d="M215 310 C 230 310 240 436 275 436" marker-end="url(#a)"/>
  <path class="ln" d="M345 436H360" marker-end="url(#a)"/>
  <path class="ln" d="M475 436H490" marker-end="url(#a)"/>
  <path class="ln" d="M567 456V470" marker-end="url(#a)"/>

  <!-- digital -->
  <rect class="dig" x="700" y="70" width="260" height="215" rx="8"/>
  <text x="830" y="92" text-anchor="middle" class="h t">DIGITAL SERVO (modelled)</text>
  <rect class="box" x="715" y="104" width="230" height="36" rx="5"/>
  <text x="830" y="121" text-anchor="middle" class="s" style="font-size:11.5px">ADC 10 bit, 2 kS/s, ±0.5 V around VCM</text>
  <rect class="box" x="715" y="148" width="230" height="52" rx="5"/>
  <text x="830" y="164" text-anchor="middle" class="s" style="font-size:11.5px">SAR acquire (≈24 ms) → 0.05 Hz integrator</text>
  <text x="830" y="178" text-anchor="middle" class="s" style="font-size:11.5px">boost on DC offset, re-acquire on |err| &gt; 0.3 V</text>
  <text x="830" y="192" text-anchor="middle" class="s" style="font-size:11.5px">auto-range from DAC code (I_DC estimate)</text>
  <rect class="box" x="715" y="208" width="230" height="66" rx="5"/>
  <text x="830" y="225" text-anchor="middle" class="s" style="font-size:11.5px">DAC: 12-bit, 0.5 nA LSB, 2.05 µA full scale</text>
  <text x="830" y="239" text-anchor="middle" class="s" style="font-size:11.5px">+ 1st-order ΣΔ fine path @100 kHz</text>
  <text x="830" y="253" text-anchor="middle" class="s" style="font-size:11.5px">NMOS sink at node x (flicker noise ∝ I_DC)</text>
  <text x="830" y="267" text-anchor="middle" class="s" style="font-size:11.5px">locks ≈ 90 ms, PPG gain 0.994</text>
  <path class="ln" d="M660 150H700" marker-end="url(#a)"/>
  <text x="680" y="143" text-anchor="middle" class="s">s_out</text>
  <path class="ln" d="M715 240 H690 V300 H220" marker-end="url(#a)"/>
  <text x="690" y="318" class="s">I_dac (sink)</text>

  <!-- correlator -->
  <rect class="dig" x="700" y="380" width="260" height="215" rx="8"/>
  <text x="830" y="402" text-anchor="middle" class="h t">CORRELATOR / DECISION (modelled)</text>
  <text x="830" y="424" text-anchor="middle" class="s" style="font-size:11.5px">48 chips @ 480 kchip/s → one decision / 100 µs</text>
  <text x="830" y="442" text-anchor="middle" class="s" style="font-size:11.5px">threshold 5.61σ (Pfa 1e-8 for AWGN)</text>
  <text x="830" y="460" text-anchor="middle" class="s" style="font-size:11.5px">+ residual goodness-of-fit test (needed, §25)</text>
  <text x="830" y="486" text-anchor="middle" class="h t" font-size="12">Pd ≥ 99.9 % needs I_DC ≳</text>
  <text x="830" y="504" text-anchor="middle" class="s" style="font-size:11.5px">24 nA (m 2 %) · 49 nA (1 %) · 97 nA (0.5 %)</text>
  <text x="830" y="520" text-anchor="middle" class="s" style="font-size:11.5px">PVT × supply: 21–29 nA at m 2 %</text>
  <text x="830" y="546" text-anchor="middle" class="s" style="font-size:11.5px">open: optical relay ≤130 ns still passes;</text>
  <text x="830" y="562" text-anchor="middle" class="s" style="font-size:11.5px">LFSR chips predictable → keyed cipher needed</text>
  <path class="ln" d="M645 494 H700" marker-end="url(#a)"/>
</svg>
